[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keko-licitacoes"
version = "0.1.0"
description = "Coletores de licitacoes publicas, comecando pelo PNCP."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Keko" }]
dependencies = [
  "requests>=2.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
keko-licitacoes = "keko_licitacoes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
