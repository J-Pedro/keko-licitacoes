services:
  - type: web
    name: keko-licitacoes-api
    runtime: docker
    plan: free
    dockerfilePath: ./keko-licitacoes-api/Dockerfile
    dockerContext: ./keko-licitacoes-api
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://keko-licitacoes-front.onrender.com

  - type: web
    name: keko-licitacoes-front
    runtime: static
    buildCommand: cd keko-licitacoes-front && npm ci && npm run build -- --configuration production
    staticPublishPath: ./keko-licitacoes-front/dist/keko-licitacoes-front/browser
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
